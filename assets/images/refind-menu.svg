<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="'Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a12"/><stop offset="100%" stop-color="#1a1a2e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="310" fill="url(#rbg)"/>
  <rect width="640" height="310" fill="none" stroke="rgba(255,255,255,.02)" stroke-width="1"/>
  <!-- rEFInd title -->
  <text x="320" y="36" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.3)" letter-spacing="3">rEFInd 0.14.2</text>
  <!-- macOS entry -->
  <rect x="90" y="64" width="200" height="168" rx="10" fill="rgba(255,255,255,.06)" stroke="rgba(122,143,107,.5)" stroke-width="2" filter="url(#glow)"/>
  <rect x="130" y="92" width="120" height="82" rx="6" fill="#7a8f6b"/>
  <text x="190" y="132" text-anchor="middle" font-size="30" fill="#fff">⌘</text>
  <text x="190" y="158" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.7)">macOS 12</text>
  <text x="190" y="204" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Macintosh HD</text>
  <text x="190" y="222" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.4)">APFS · disk0s2</text>
  <!-- Ubuntu entry -->
  <rect x="350" y="64" width="200" height="168" rx="10" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
  <rect x="390" y="92" width="120" height="82" rx="6" fill="#c16a4b"/>
  <text x="450" y="132" text-anchor="middle" font-size="26" fill="#fff" font-weight="700" font-family="monospace">&gt;_</text>
  <text x="450" y="158" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.7)">Ubuntu 22.04</text>
  <text x="450" y="204" text-anchor="middle" font-size="13" fill="rgba(255,255,255,.8)" font-weight="600">Ubuntu</text>
  <text x="450" y="222" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.4)">ext4 · disk0s4</text>
  <!-- GRUB entry -->
  <rect x="190" y="252" width="260" height="34" rx="8" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <text x="320" y="273" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.4)">GRUB 2.06 — Ubuntu (secours)</text>
  <!-- Selection indicator -->
  <text x="190" y="246" text-anchor="middle" font-size="10" fill="#7a8f6b">▲ sélectionné</text>
  <!-- Bottom hint -->
  <text x="320" y="304" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.2)">← → pour naviguer · Entrée pour démarrer · Esc pour le menu EFI</text>
</svg>