  <text x="24" y="260" font-size="10.5" fill="#aaa">Kernel driver in use: facetimehd</text>
  <text x="24" y="276" font-size="10.5" fill="#aaa">Kernel modules: facetimehd</text>
  <text x="12" y="300" font-size="10.5" fill="#a5d6a7">00:1f.3 Audio device: Intel Corporation Wildcat</text>
  <text x="12" y="316" font-size="10.5" fill="#a5d6a7">        Point-LP High Definition Audio Controller</text>
