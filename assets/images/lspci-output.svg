  <text x="320" y="18" text-anchor="middle" font-size="11" fill="#aaa">Terminal — lspci -k</text>
  <text x="12" y="52" font-size="11" fill="#78dc78">alessio@macbook-air:~$</text>
  <text x="228" y="52" font-size="11" fill="#d4d4d4"> lspci -k | grep -A3 "Network\|VGA\|Multimedia"</text>
  <text x="12" y="78" font-size="10.5" fill="#f4c7c3">02:00.0 Network controller: Broadcom Inc. and</text>
  <text x="12" y="94" font-size="10.5" fill="#f4c7c3">        subsidiaries BCM4360 802.11ac Wireless Network Adapter</text>
  <text x="24" y="112" font-size="10.5" fill="#aaa">Kernel driver in use: wl</text>
  <text x="24" y="128" font-size="10.5" fill="#aaa">Kernel modules: bcma, wl</text>
  <text x="12" y="152" font-size="10.5" fill="#80cbc4">00:02.0 VGA compatible controller: Intel Corporation</text>
  <text x="12" y="168" font-size="10.5" fill="#80cbc4">        HD Graphics 6000 (rev 09)</text>
  <text x="24" y="186" font-size="10.5" fill="#aaa">Subsystem: Apple Inc. HD Graphics 6000</text>
  <text x="24" y="202" font-size="10.5" fill="#aaa">Kernel driver in use: i915</text>
  <text x="12" y="226" font-size="10.5" fill="#ce93d8">03:00.0 Multimedia controller: Broadcom Inc. and</text>
