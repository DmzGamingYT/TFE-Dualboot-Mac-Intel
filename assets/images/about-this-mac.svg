<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8e0d8"/><stop offset="100%" stop-color="#d4ccc4"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f6f3ef"/><stop offset="100%" stop-color="#eae5df"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-opacity=".25"/></filter>
  </defs>
  <rect width="640" height="400" rx="12" fill="url(#bg)"/>
  <!-- Window -->
  <rect x="30" y="22" width="580" height="356" rx="10" fill="url(#win)" stroke="#bbb5ad" stroke-width="1" filter="url(#shadow)"/>
  <!-- Title bar -->
  <rect x="30" y="22" width="580" height="30" rx="10" fill="#e0dbd5"/>
  <rect x="30" y="42" width="580" height="10" fill="#e0dbd5"/>
  <circle cx="50" cy="37" r="6" fill="#ff5f57"/><circle cx="68" cy="37" r="6" fill="#febc2e"/><circle cx="86" cy="37" r="6" fill="#28c840"/>
  <text x="320" y="42" text-anchor="middle" font-size="12" font-weight="600" fill="#4a4540">À propos de ce Mac</text>
  <!-- MacBook icon area -->
  <rect x="200" y="68" width="240" height="4" rx="2" fill="#c8c2ba"/>
  <rect x="218" y="60" width="204" height="10" rx="5" fill="#b5afa7"/>
  <rect x="238" y="52" width="164" height="10" rx="5" fill="#a8a29a"/>
  <!-- MacBook Air image placeholder -->
  <rect x="168" y="78" width="304" height="110" rx="8" fill="#c5bfb7" stroke="#a8a29a" stroke-width="1"/>
  <rect x="186" y="87" width="268" height="82" rx="4" fill="#2c231d"/>
  <rect x="196" y="95" width="248" height="66" rx="2" fill="#7a8f6b"/>
  <text x="320" y="133" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">macOS Monterey</text>
  <!-- Info section -->
  <text x="320" y="216" text-anchor="middle" font-size="20" font-weight="600" fill="#2c231d" font-family="Georgia,serif">MacBook Air 13 pouces</text>
  <text x="320" y="234" text-anchor="middle" font-size="13" fill="#6b5c50">Début 2015</text>
  <!-- Specs table -->
  <text x="140" y="268" font-size="12" fill="#9c8a7a">Chip</text>
  <text x="260" y="268" font-size="12" fill="#2c231d">Intel Core i5 double cœur 1,6 GHz</text>
  <line x1="135" y1="278" x2="505" y2="278" stroke="#e5dad0" stroke-width="1"/>
  <text x="140" y="295" font-size="12" fill="#9c8a7a">Mémoire</text>
  <text x="260" y="295" font-size="12" fill="#2c231d">8 Go 1600 MHz DDR3</text>
  <line x1="135" y1="305" x2="505" y2="305" stroke="#e5dad0" stroke-width="1"/>
  <text x="140" y="322" font-size="12" fill="#9c8a7a">Graphique</text>
  <text x="260" y="322" font-size="12" fill="#2c231d">Intel HD Graphics 6000 1536 Mo</text>
  <line x1="135" y1="332" x2="505" y2="332" stroke="#e5dad0" stroke-width="1"/>
  <text x="140" y="349" font-size="12" fill="#9c8a7a">Numéro de série</text>
  <text x="260" y="349" font-size="12" fill="#2c231d">C02XXXXXXXX</text>
</svg>