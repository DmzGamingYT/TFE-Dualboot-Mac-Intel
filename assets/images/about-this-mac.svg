<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8e0d8"/><stop offset="100%" stop-color="#d4ccc4"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f6f3ef"/><stop offset="100%" stop-color="#eae5df"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-opacity=".25"/></filter>
  </defs>
  <rect width="580" height="420" rx="12" fill="url(#bg)"/>
  <!-- Window -->
  <rect x="40" y="30" width="500" height="360" rx="10" fill="url(#win)" stroke="#bbb5ad" stroke-width="1" filter="url(#shadow)"/>
  <!-- Title bar -->
  <rect x="40" y="30" width="500" height="32" rx="10" fill="#e0dbd5"/>
  <rect x="40" y="52" width="500" height="10" fill="#e0dbd5"/>
  <circle cx="60" cy="46" r="6" fill="#ff5f57"/><circle cx="78" cy="46" r="6" fill="#febc2e"/><circle cx="96" cy="46" r="6" fill="#28c840"/>
  <text x="290" y="51" text-anchor="middle" font-size="12" font-weight="600" fill="#4a4540">À propos de ce Mac</text>
  <!-- MacBook icon area -->
  <rect x="180" y="80" width="220" height="4" rx="2" fill="#c8c2ba"/>
  <rect x="200" y="72" width="180" height="10" rx="5" fill="#b5afa7"/>
  <rect x="220" y="64" width="140" height="10" rx="5" fill="#a8a29a"/>
  <!-- MacBook Air image placeholder -->
  <rect x="150" y="90" width="280" height="120" rx="8" fill="linear-gradient(#c5bfb7,#b5afa7)" stroke="#a8a29a" stroke-width="1"/>
  <rect x="170" y="100" width="240" height="90" rx="4" fill="#2c231d"/>
  <rect x="180" y="108" width="220" height="74" rx="2" fill="linear-gradient(#5d6e50,#7a8f6b)"/>
  <text x="290" y="150" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">macOS Monterey</text>
  <!-- Info section -->
  <text x="290" y="240" text-anchor="middle" font-size="20" font-weight="600" fill="#2c231d" font-family="Georgia,serif">MacBook Air 13 pouces</text>
  <text x="290" y="258" text-anchor="middle" font-size="13" fill="#6b5c50">Début 2015</text>
  <!-- Specs table -->
  <text x="160" y="295" font-size="12" fill="#9c8a7a">Chip</text>
  <text x="300" y="295" font-size="12" fill="#2c231d">Intel Core i5 double cœur 1,6 GHz</text>
  <line x1="155" y1="305" x2="425" y2="305" stroke="#e5dad0" stroke-width="1"/>
  <text x="160" y="322" font-size="12" fill="#9c8a7a">Mémoire</text>
  <text x="300" y="322" font-size="12" fill="#2c231d">8 Go 1600 MHz DDR3</text>
  <line x1="155" y1="332" x2="425" y2="332" stroke="#e5dad0" stroke-width="1"/>
  <text x="160" y="349" font-size="12" fill="#9c8a7a">Graphique</text>
  <text x="300" y="349" font-size="12" fill="#2c231d">Intel HD Graphics 6000 1536 Mo</text>
  <line x1="155" y1="359" x2="425" y2="359" stroke="#e5dad0" stroke-width="1"/>
  <text x="160" y="376" font-size="12" fill="#9c8a7a">Numéro de série</text>
  <text x="300" y="376" font-size="12" fill="#2c231d">C02XXXXXXXX</text>
</svg>